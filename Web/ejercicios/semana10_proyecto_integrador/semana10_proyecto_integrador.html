<!DOCTYPE html>
<!--
  Semana 10: Proyecto integrador

  La persona elige uno de estos proyectos: Pagina personal/portfolio, Landing
  page de un negocio, Lista de tareas, Menu de un restaurante, Curriculum en
  HTML, Pagina de un evento.

  Este archivo es una implementacion de referencia de UNO de esos proyectos
  (Pagina personal/portfolio de una pagina), para que el profesor tenga un
  ejemplo completo de lo que se espera: HTML semantico + CSS con Flexbox/Grid
  y media query + JavaScript con eventos y DOM, todo combinado en una sola
  pagina adaptable a celulares.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Semana 10</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #222;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222;
      color: white;
      padding: 15px 30px;
    }

    header nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
    }

    section {
      padding: 30px;
    }

    .proyectos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .tarjeta-proyecto {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 6px;
    }

    form label {
      display: block;
      margin-top: 10px;
    }

    #mensajeContacto {
      font-weight: bold;
      margin-top: 10px;
    }

    /* Responsive: en pantallas chicas, la barra y la grilla se apilan */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      .proyectos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Mi nombre</h1>
    <nav>
      <a href="#sobre-mi">Sobre mi</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <section id="sobre-mi">
    <h2>Sobre mi</h2>
    <p>Estoy aprendiendo desarrollo web: HTML, CSS y JavaScript.</p>
  </section>

  <section id="proyectos">
    <h2>Proyectos</h2>
    <div class="proyectos">
      <div class="tarjeta-proyecto">
        <h3>Proyecto 1</h3>
        <p>Descripcion corta del proyecto.</p>
      </div>
      <div class="tarjeta-proyecto">
        <h3>Proyecto 2</h3>
        <p>Descripcion corta del proyecto.</p>
      </div>
      <div class="tarjeta-proyecto">
        <h3>Proyecto 3</h3>
        <p>Descripcion corta del proyecto.</p>
      </div>
    </div>
  </section>

  <section id="contacto">
    <h2>Contacto</h2>
    <form id="formularioContacto">
      <label>
        Nombre:
        <input type="text" id="nombreContacto" required>
      </label>
      <label>
        Mensaje:
        <textarea id="mensaje" required></textarea>
      </label>
      <button type="submit">Enviar</button>
    </form>
    <p id="mensajeContacto"></p>
  </section>

  <script>
    document.getElementById("formularioContacto").addEventListener("submit", function (evento) {
      evento.preventDefault();
      const nombre = document.getElementById("nombreContacto").value;
      document.getElementById("mensajeContacto").textContent =
        `Gracias ${nombre}, tu mensaje fue enviado (simulado, no hay backend todavia).`;
      this.reset();
    });
  </script>

</body>
</html>
